<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game">
        <h1>Rock Paper Scissors</h1>

        <div class="choices">
            <button class="choice" data-choice="rock">✊</button>
            <button class="choice" data-choice="paper">✋</button>
            <button class="choice" data-choice="scissors">✌️</button>
        </div>

        <div class="selections">
            <p>Let's Start <span id="user-choice">-</span></p>
            <!-- <p>Computer selected: <span id="computer-choice">-</span></p> -->
        </div>

        <p class="result" id="result">Make your move!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
